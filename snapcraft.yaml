name: kodi-omega
version: 21.3.12
summary: kodi-omega
description: |
  This is an unofficial build which includes all available plugins from the official repository.
  This Snap contains the **Omega** branch and supports x11 and wayland.
  You can start Kodi via terminal using `kodi-omega` or by selecting it from the menu.
  On the first start, Kodi will prompt you to enable or disable available addons,
  this may take a few minutes.
  Alternatively, you can simply _press "s"_, exit Kodi, then restart kodi-omega.
  This will disable all addons by default, allowing you to activate only the ones you actually need afterward.
  **Make sure to enable the necessary permissions** for this Snap in GNOME (Settings → Apps) or KDE (Discover → Kodi-Omega → Change Permissions), otherwise Kodi may not work as expected.
  You can also manage permissions via terminal by listing them with "snap connections kodi-omega" and enabling missing ones using "snap connect kodi-omega:dvb" for DVB access.
  Or simply connect all:
  `snap connections kodi-omega | awk '$3 == "-" {print $2}' | while read plug; do sudo snap connect $plug; done`
  Or try my snap-permissions-manager script:
  https://github.com/Tibsun75/snap-permission-manager
  For IPTV, you will need an M3U playlist file or a membership with services such as Zattoo, Waipu, Pluto or similar providers.
  Bluray KEYDB.cfg must be here : ~/config/aacs , because of lack support bd+ for linux ... maybe will not work for all
  Enjoy your media with Kodi Omega!
# ==================================Änderungen===============================================================
# Umgestellt auf GPU: extensions [gpu] → gpu-2404 / mesa-2404
# Wayland: Wrapper verlinkt Host-Socket nach $XDG_RUNTIME_DIR
# Audio: PulseAudio – Canonical-Trick PULSE_SERVER
# CEC und LIRC dazu
# bluray und dvd untersützung dazu
# KEYDB.cfg muss in ~/config/aacs liegen
# ==========================================================================================================
confinement: strict
grade: stable
base: core24
source-code: https://github.com/Tibsun75/kodi-omega-snap

plugs:
  dot-config-aacs:
    interface: personal-files
    read:
      - $HOME/.config/aacs

platforms:
  amd64:

layout:
  /usr/share/X11/xkb:
    bind: $SNAP/usr/share/X11/xkb

parts:
  wrappers:
    plugin: nil
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cat > "$CRAFT_PART_INSTALL/bin/wayland-socket.sh" << 'EOF'
      #!/bin/bash
      set -euo pipefail
      if [[ -n "${XDG_RUNTIME_DIR:-}" && -n "${WAYLAND_DISPLAY:-}" ]]; then
        host_sock="/run/user/$(id -u)/${WAYLAND_DISPLAY}"
        snap_sock="${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}"
        if [[ -S "$host_sock" && ! -e "$snap_sock" ]]; then
          ln -sf "$host_sock" "$snap_sock" 2>/dev/null || true
        fi
      fi
      exec "$@"
      EOF
      chmod +x "$CRAFT_PART_INSTALL/bin/wayland-socket.sh"

  kodi-omega:
    after: [wrappers]
    plugin: cmake
    source: https://github.com/xbmc/xbmc.git
    source-branch: Omega
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr/local
      - -DCORE_PLATFORM_NAME="x11 wayland"
      - -DAPP_RENDER_SYSTEM=gl
      - -DENABLE_INTERNAL_FFMPEG=ON
      - -DENABLE_INTERNAL_FMT=ON
      - -DENABLE_INTERNAL_FLATBUFFERS=ON
      - -DENABLE_VAAPI=ON
      - -DENABLE_VDPAU=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_ALSA=ON
      - -DENABLE_CEC=ON
      - -DENABLE_LIRCCLIENT=ON
      - -DCMAKE_CXX_FLAGS=-Wno-error=double-promotion
    build-packages:
      - debhelper
      - autoconf
      - automake
      - autopoint
      - gettext
      - autotools-dev
      - cmake
      - curl
      - default-jre
      - doxygen
      - gawk
      - gcc
      - gdc
      - gperf
      - libasound2-dev
      - libass-dev
      - libavahi-client-dev
      - libavahi-common-dev
      - libbluetooth-dev
      - libbluray-dev
      - libbz2-dev
      - libcdio-dev
      - libp8-platform-dev
      - libcrossguid-dev
      - libcurl4-openssl-dev
      - libcwiid-dev
      - libdbus-1-dev
      - libdrm-dev
      - libegl1-mesa-dev
      - libenca-dev
      - libexiv2-dev
      - libflac-dev
      - libfmt-dev
      - libfontconfig-dev
      - libfreetype6-dev
      - libfribidi-dev
      - libfstrcmp-dev
      - libgcrypt-dev
      - libgif-dev
      - libgles2-mesa-dev
      - libgl1-mesa-dev
      - libglu1-mesa-dev
      - libgnutls28-dev
      - libgpg-error-dev
      - libgtest-dev
      - libiso9660-dev
      - libjpeg-dev
      - liblcms2-dev
      - libltdl-dev
      - liblzo2-dev
      - libmicrohttpd-dev
      - libmysqlclient-dev
      - libnfs-dev
      - libogg-dev
      - libpcre2-dev
      - libplist-dev
      - libpng-dev
      - libpulse-dev
      - libshairplay-dev
      - libsmbclient-dev
      - libspdlog-dev
