      - libavahi-common3
      - libbluetooth3
      - libbluray2
      - libcec6
      - libsmbclient0
      - samba-libs
      - libexiv2-27
      - libfstrcmp0
      - liblcms2-2
      - liblirc-client0t64
      - libmicrohttpd12t64
      - libmysqlclient21
      - libnfs14
      - libplist-2.0-4
      - libpulse0
      - apulse
      - libtag1v5-vanilla
      - libtinyxml2.6.2v5
      - libxslt1.1
      - libshairplay0
      - libtinyxml2-10
      - libpcre3
      - libfmt9
      - libdav1d7
      - libavahi-compat-libdnssd1
      - python3-pil
      - python3-pip
      - libjpeg8
      - libfreetype6
      - libopenjp2-7
      - libwebp7
      # DVD
      - libdvdcss2
      - libdvdnav4
      - libdvdread8t64
      # Blu-ray
      - libaacs0
      - libbdplus0
      # Tastatur / XKB
      - xkb-data
      # Wayland-Client
      - libwayland-client0
      - libwayland-egl1
      - libwayland-cursor0
      - libxkbcommon0
      - libgbm1
      - libwayland-client++1
      - libwayland-cursor++1
      - libwayland-egl++1
    override-build: |
      craftctl default
      cd $CRAFT_PART_SRC
      sed -i 's|/usr/local|$SNAP/usr/local|g' $CRAFT_PART_INSTALL/usr/local/bin/kodi*
      # ======== Addons bauen =========
      make -j$(getconf _NPROCESSORS_ONLN) -C tools/depends/target/binary-addons PREFIX=$CRAFT_PART_INSTALL/usr/local
      # ==============================

apps:
  kodi-omega:
    command: usr/local/bin/kodi
    extensions: [gpu]
    command-chain:
      - bin/wayland-socket.sh
    environment:
      WAYLAND_DISPLAY: $WAYLAND_DISPLAY
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu/vdpau:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/usr/lib/x86_64-linux-gnu/samba:$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/local/lib/kodi:$LD_LIBRARY_PATH
      PYTHONPATH: $SNAP/usr/lib/python3.12/site-packages:$SNAP/usr/lib/python3/dist-packages
      KODI_HOME: $SNAP/usr/local/share/kodi
      XBMCBIN: $SNAP/usr/local/lib/kodi
      PULSE_SERVER: unix:$XDG_RUNTIME_DIR/../pulse/native
    plugs:
      - audio-playback
      - avahi-control
      - avahi-observe
      - bluetooth-control
      - bluez
      - browser-support
      - desktop
      - desktop-legacy
      - dot-config-aacs
      - home
      - network
      - network-bind
      - network-status
      - opengl
      - optical-drive
      - screen-inhibit-control
      - screencast-legacy
      - unity7
