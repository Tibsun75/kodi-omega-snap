      - x11
      - pulseaudio
      - hardware-observe
      - gsettings
      - joystick
      - upower-observe
      - removable-media
      - dvb
      - display-control
      - login-session-control
      - login-session-observe
      - log-observe
      - mount-observe
      - power-control
      - raw-input
      - raw-usb
      - system-observe
      - shutdown
      - udisks2
